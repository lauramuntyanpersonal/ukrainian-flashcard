<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2447f6" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Ukrainian Flashcards" />
    <title>Ukrainian Flashcards</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon-192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="./icon-192.png" sizes="192x192" type="image/png" />
    <link rel="apple-touch-icon" href="./icon-512.png" sizes="512x512" type="image/png" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Language study</p>
          <h1>Ukrainian flashcards</h1>
        </div>
        <button id="update-button" class="ghost mini" type="button">Update app</button>
      </header>

      <nav class="tab-bar" aria-label="Primary navigation">
        <button type="button" class="tab-button active" data-tab="words">Words</button>
        <button type="button" class="tab-button" data-tab="sets">Sets</button>
        <button type="button" class="tab-button" data-tab="upload">Upload</button>
      </nav>

      <main class="content" id="app">
        <section class="panel tab-panel active" data-panel="words">
          <div class="section-header">
            <h2>All words</h2>
            <button id="refresh-words-button" class="ghost mini" type="button">Refresh</button>
          </div>
          <div id="words-list" class="words-list"></div>
        </section>

        <section class="panel tab-panel" data-panel="sets">
          <div class="section-header">
            <h2>Your sets</h2>
            <button id="reset-button" class="ghost mini" type="button">Reset demo</button>
          </div>
          <div id="set-list" class="set-list"></div>
        </section>

        <section class="panel upload-panel tab-panel" data-panel="upload">
          <h2>Upload a new word set</h2>
          <form id="upload-form">
            <p class="helper-text">Upload your full CSV or JSON as a raw word bank. You can choose the rows you want and make flashcards later.</p>
            <label class="file-picker">
              <span>Choose CSV</span>
              <input type="file" id="file-input" accept=".csv,.json" required />
            </label>
            <button type="submit">Upload word bank</button>
          </form>
          <div id="upload-status" class="status" aria-live="polite"></div>

          <div id="selection-panel" class="selection-panel hidden">
            <div class="section-header">
              <h2>Choose rows for the set</h2>
              <button id="select-all-rows" class="ghost mini" type="button">Select all</button>
            </div>
            <div id="selection-list" class="selection-list"></div>
            <button id="create-selected-set" type="button">Create selected set</button>
          </div>
        </section>
      </main>

      <section id="study-panel" class="panel study-panel hidden">
        <header class="topbar compact">
          <button id="back-button" class="secondary mini" type="button">← Back</button>
          <div>
            <p class="eyebrow">Study set</p>
            <h2 id="study-title">Set</h2>
          </div>
        </header>

        <div id="flashcard" class="flashcard" aria-live="polite">
          <div class="card-side front-side">
            <span class="badge">Front</span>
            <h2 id="front-text">Loading...</h2>
          </div>
          <div class="card-side back-side hidden" id="back-side">
            <span class="badge accent">Back</span>
            <h3 id="back-text"></h3>
            <p id="phrase-text"></p>
            <p id="phrase-translation" class="muted"></p>
            <small id="note-text"></small>
          </div>
        </div>

        <div class="study-actions">
          <button id="speak-btn" class="secondary" type="button">🔊 Hear it</button>
          <button id="flip-btn" type="button">Flip card</button>
          <button id="next-btn" class="secondary" type="button">Next</button>
        </div>

        <div class="study-footer">
          <button id="known-btn" class="success" type="button">I know this</button>
          <button id="again-btn" class="ghost" type="button">Again</button>
        </div>
      </section>
    </div>

    <div id="update-status" class="status" aria-live="polite"></div>

    <script>
      const APP_VERSION = '20260912-4';
      const updateButton = document.getElementById('update-button');
      const updateStatus = document.getElementById('update-status');
      let refreshTimer = null;

      function setUpdateStatus(message, kind = '') {
        if (!updateStatus) return;
        updateStatus.textContent = message;
        updateStatus.className = 'status' + (kind ? ` ${kind}` : '');
      }

      async function checkRemoteVersion() {
        try {
          const current = localStorage.getItem('ukrainian-flashcards-version');
          const response = await fetch(`./version.txt?ts=${Date.now()}`, {
            cache: 'no-store',
            headers: { 'Cache-Control': 'no-cache, no-store, must-revalidate' }
          });

          if (!response.ok) return;

          const latest = (await response.text()).trim();
          if (!latest) return;

          if (current !== latest) {
            localStorage.setItem('ukrainian-flashcards-version', latest);
            if (current) {
              window.location.reload();
            }
            return;
          }

          if (!current) {
            localStorage.setItem('ukrainian-flashcards-version', latest);
          }
        } catch (error) {
          // Ignore and continue; browser will still use stale HTML until the next refresh.
        }
      }

      checkRemoteVersion();

      function hardReloadApp() {
        if (navigator.serviceWorker && navigator.serviceWorker.controller) {
          navigator.serviceWorker.controller.postMessage({ type: 'SKIP_WAITING' });
        }

        setUpdateStatus('Refreshing app cache...', 'success');

        const cacheKeys = ['ukrainian-flashcards-version'];
        cacheKeys.forEach((key) => localStorage.removeItem(key));

        const originalUrl = `${window.location.origin}${window.location.pathname}`;
        window.location.replace(originalUrl);
      }

      function promptAppUpdate(registration) {
        if (!registration || !registration.waiting) return;
        registration.waiting.postMessage({ type: 'SKIP_WAITING' });
        setUpdateStatus('Update ready — refreshing app...', 'success');
        setTimeout(() => hardReloadApp(), 300);
      }

      async function checkForServiceWorkerUpdate() {
        if (!('serviceWorker' in navigator)) return;

        try {
          const registration = await navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' });

          registration.addEventListener('updatefound', () => {
            const installingWorker = registration.installing;
            if (!installingWorker) return;

            installingWorker.addEventListener('statechange', () => {
              if (installingWorker.state === 'installed' && navigator.serviceWorker.controller) {
                promptAppUpdate(registration);
              }
            });
          });

          await registration.update();
          if (registration.waiting && navigator.serviceWorker.controller) {
            promptAppUpdate(registration);
          }
        } catch (error) {
          setUpdateStatus('Update check failed.', 'error');
        }
      }

      async function refreshIfNeeded() {
        if (!('serviceWorker' in navigator)) return;

        try {
          const registration = await navigator.serviceWorker.getRegistration();
          if (!registration) {
            await checkForServiceWorkerUpdate();
            return;
          }

          await registration.update();
          if (registration.waiting) {
            promptAppUpdate(registration);
          }
        } catch (error) {
          setUpdateStatus('Checking for refresh...', '');
        }
      }

      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          checkForServiceWorkerUpdate();

          navigator.serviceWorker.addEventListener('controllerchange', () => {
            if (refreshTimer) return;
            refreshTimer = setTimeout(() => {
              window.location.reload();
            }, 250);
          });
        });

        document.addEventListener('visibilitychange', () => {
          if (!document.hidden) {
            refreshIfNeeded();
          }
        });

        window.addEventListener('focus', () => {
          refreshIfNeeded();
        });
      }

      if (updateButton) {
        updateButton.addEventListener('click', async () => {
          setUpdateStatus('Checking for updates...', '');
          if ('serviceWorker' in navigator) {
            const registration = await navigator.serviceWorker.getRegistration();
            if (registration) {
              await registration.update();
              if (registration.waiting) {
                promptAppUpdate(registration);
                return;
              }
            }
          }

          setUpdateStatus('Refreshing app...', 'success');
          hardReloadApp();
        });
      }
    </script>
    <script src="./app.js"></script>
  </body>
</html>
